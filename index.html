<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Test Generator - Word (.doc)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f6f9; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8; 
            margin-top: 0;
        }
        textarea { 
            width: 100%; 
            height: 350px; 
            padding: 15px; 
            font-size: 15px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 20px; 
            background-color: #1a73e8; 
            color: #ffffff; 
            font-size: 18px; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #1557b0;
        }
        #statusMessage {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bulk Test Word Generator (100% Offline & No Errors)</h2>

        <textarea id="inputText" placeholder="यहाँ प्रश्न पेस्ट करें...

1. प्रश्न...
A. ऑप्शन 1
B. ऑप्शन 2
C. ऑप्शन 3
D. ऑप्शन 4
सही उत्तर - A
व्याख्या - उत्तर की व्याख्या..."></textarea>

        <button id="downloadBtn" onclick="generateAndDownloadWord()">Word फाइल डाउनलोड करें (.doc)</button>
        <div id="statusMessage"></div>
    </div>

    <script>
        function parseInputText(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;
            let currentState = 'none';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // प्रश्न ढूँढना (1. या 1))
                const qMatch = line.match(/^(\d+)[\.\)]\s*(.*)/);
                if (qMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { id: qMatch[1], text: qMatch[2], options: {}, answer: '', solution: '' };
                    currentState = 'question';
                    continue;
                }

                // ऑप्शन ढूँढना (A., B., C., D.)
                const optMatch = line.match(/^([A-D])[\.\)]\s*(.*)/);
                if (optMatch && currentQ) {
                    currentQ.options[optMatch[1]] = optMatch[2];
                    currentState = 'options';
                    continue;
                }

                // उत्तर ढूँढना
                const ansMatch = line.match(/^(?:सही उत्तर|Correct Option|Answer)\s*[:\-]\s*([A-D])/i);
                if (ansMatch && currentQ) {
                    currentQ.answer = ansMatch[1].toUpperCase();
                    currentState = 'answer';
                    continue;
                }

                // व्याख्या ढूँढना
                const solMatch = line.match(/^(?:व्याख्या|Solution)\s*[:\-]\s*(.*)/i);
                if (solMatch !== null && currentQ) {
                    currentQ.solution = solMatch[1] ? solMatch[1] : '';
                    currentState = 'solution';
                    continue;
                }

                if (currentQ) {
                    if (currentState === 'question') {
                        currentQ.text += '<br>' + line;
                    } else if (currentState === 'solution') {
                        currentQ.solution += '<br>' + line;
                    } else if (currentState === 'options') {
                        const lastOpt = Object.keys(currentQ.options).pop();
                        if (lastOpt) {
                            currentQ.options[lastOpt] += ' ' + line;
                        }
                    }
                }
            }

            if (currentQ) questions.push(currentQ);
            return questions;
        }

        function generateAndDownloadWord() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('statusMessage');
            const text = document.getElementById('inputText').value;

            if (!text.trim()) {
                alert('कृपया पहले बॉक्स में प्रश्न पेस्ट करें!');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = 'फाइल बन रही है...';
                status.innerText = '';

                const questions = parseInputText(text);

                if (questions.length === 0) {
                    alert('कोई सही प्रश्न नहीं मिला! कृपया सुनिश्चित करें कि प्रश्न "1." से शुरू हों और ऑप्शन "A." से।');
                    btn.disabled = false;
                    btn.innerText = 'Word फाइल डाउनलोड करें (.doc)';
                    return;
                }

                // Word Document HTML Structure for perfect formatting & Hindi support
                let htmlBody = `
                    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                    <head>
                        <meta charset="utf-8">
                        <title>Test Paper</title>
                        <style>
                            body { font-family: 'Mangal', 'Nirmala UI', Arial, sans-serif; font-size: 14pt; line-height: 1.6; color: #000000; padding: 20px; }
                            .q-box { margin-bottom: 20px; }
                            .question { font-weight: bold; margin-bottom: 8px; }
                            .option { margin-left: 25px; margin-bottom: 5px; font-weight: normal; }
                            .answer { font-weight: bold; color: #008000; margin-top: 5px; margin-left: 25px; }
                            .solution { font-style: italic; color: #333333; margin-top: 5px; margin-left: 25px; }
                        </style>
                    </head>
                    <body>
                `;

                questions.forEach((q, index) => {
                    const qNum = index + 1;
                    htmlBody += `<div class="q-box">`;
                    htmlBody += `<div class="question">प्रश्न ${qNum}: ${q.text}</div>`;
                    
                    ['A', 'B', 'C', 'D'].forEach(optKey => {
                        if (q.options[optKey]) {
                            htmlBody += `<div class="option"><b>${optKey}.</b> ${q.options[optKey]}</div>`;
                        }
                    });

                    if (q.answer) {
                        htmlBody += `<div class="answer">सही उत्तर: ${q.answer}</div>`;
                    }

                    if (q.solution) {
                        htmlBody += `<div class="solution">व्याख्या: ${q.solution}</div>`;
                    }

                    htmlBody += `</div><br>`;
                });

                htmlBody += `</body></html>`;

                // UTF-8 BOM (\ufeff) ensures Hindi words are 100% supported in MS Word
                const blob = new Blob(['\ufeff' + htmlBody], {
                    type: 'application/msword;charset=utf-8'
                });

                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = `Bulk_Test_${Date.now()}.doc`;
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                }, 100);

                btn.disabled = false;
                btn.innerText = 'Word फाइल डाउनलोड करें (.doc)';
                status.innerText = '✅ फाइल सफलतापूर्वक डाउनलोड हो गई!';
                setTimeout(() => status.innerText = '', 4000);

            } catch (error) {
                console.error(error);
                alert("प्रोसेस एरर: " + error.message);
                btn.disabled = false;
                btn.innerText = 'Word फाइल डाउनलोड करें (.doc)';
            }
        }
    </script>
</body>
</html>
