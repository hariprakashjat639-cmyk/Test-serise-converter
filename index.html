<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Test Series Format Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .container { 
            max-width: 1050px; 
            margin: 20px auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin-top: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .pane {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        textarea { 
            width: 100%; 
            height: 420px; 
            padding: 15px; 
            font-size: 14px; 
            border: 2px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        button { 
            flex: 1;
            padding: 14px; 
            background-color: var(--primary); 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 600;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--success);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .btn-secondary:hover {
            background-color: var(--success-hover);
        }

        #statusMessage {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            color: var(--success);
            font-size: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Universal Test Series Format Generator</h2>
        
        <div class="grid">
            <!-- Input Pane -->
            <div class="pane">
                <label for="inputText">यहाँ रॉ (Raw) प्रश्न पेस्ट करें:</label>
                <textarea id="inputText" placeholder="प्रश्न 1: एरणपुरा छावनी में 1857 की क्रांति...
(अ) पंद्रह मई
(ब) इक्कीस अगस्त
(स) तेईस अगस्त
(द) पंद्रह अक्टूबर
सही उत्तर: (ब) इक्कीस अगस्त
व्याख्या: 21 अगस्त 1857 को..."></textarea>
                
                <div class="btn-group">
                    <button onclick="generateCustomFormat()">फॉर्मेट में बदलें</button>
                </div>
            </div>

            <!-- Output Pane -->
            <div class="pane">
                <label for="outputText">आउटपुट फॉर्मेट:</label>
                <textarea id="outputText" readonly placeholder="यहाँ आपका कन्वर्ट किया हुआ फॉर्मेट दिखेगा..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-secondary" onclick="downloadFile()">फाइल डाउनलोड करें</button>
                    <button onclick="copyText()">कॉपी करें</button>
                </div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        function normalizeOptionKey(symbol) {
            if (!symbol) return null;
            symbol = symbol.trim().toLowerCase();
            
            if (['a', 'अ', 'क', '1'].includes(symbol)) return 'A';
            if (['b', 'ब', 'ख', '2'].includes(symbol)) return 'B';
            if (['c', 'स', 'ग', '3'].includes(symbol)) return 'C';
            if (['d', 'द', 'घ', '4'].includes(symbol)) return 'D';

            return null;
        }

        function parseBlock(blockText) {
            const lines = blockText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) return null;

            let qObj = {
                text: "",
                options: { A: "", B: "", C: "", D: "" },
                answer: "",
                solution: ""
            };

            let optKeys = ['A', 'B', 'C', 'D'];
            let currentOptIdx = 0;
            let currentSection = 'question';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // 1. उत्तर (Answer) पंक्ति पहचान
                const ansMatch = line.match(/^(?:सही\s*उत्तर|उत्तर|Correct\ answer|Correct\ option|Answer|Ans)[\s:\-]*(.*)/i);
                if (ansMatch) {
                    currentSection = 'answer';
                    let content = ansMatch[1];
                    let keyMatch = content.match(/[\(\[\s]*([A-Da-d|अ|ब|स|द|क|ख|ग|घ|1-4])[\)\]\s]*/);
                    if (keyMatch) {
                        qObj.answer = normalizeOptionKey(keyMatch[1]) || "";
                    }
                    continue;
                }

                // 2. व्याख्या (Solution) पंक्ति पहचान
                const solMatch = line.match(/^(?:व्याख्या|स्पष्टीकरण|Solution|Exp|Explanation)[\s:\-]*(.*)/i);
                if (solMatch) {
                    currentSection = 'solution';
                    qObj.solution = solMatch[1] ? solMatch[1] : "";
                    continue;
                }

                // 3. विकल्प (Option) पंक्ति पहचान
                const optMatch = line.match(/^[\(\[]?\s*([A-Da-d|अ|ब|स|द|क|ख|ग|घ|1-4])\s*[\)\]\.\:]\s*(.*)/);
                if (optMatch && currentSection !== 'solution') {
                    let mapped = normalizeOptionKey(optMatch[1]);
                    if (mapped) {
                        currentSection = 'option';
                        qObj.options[mapped] = optMatch[2];
                        continue;
                    }
                }

                // 4. सामान्य टेक्स्ट वितरण
                if (currentSection === 'question') {
                    // प्रश्न हेडिंग/नंबर साफ़ करना
                    let cleanText = line.replace(/^(?:प्रश्न|Q|Question)?\s*[\(\[]?\d+[\.\:\)]\s*/i, '');
                    qObj.text += (qObj.text ? '\n' : '') + cleanText;
                } else if (currentSection === 'option') {
                    // यदि बिना किसी चिन्ह के विकल्प लिखा हो तो क्रमानुसार A, B, C, D भरना
                    if (currentOptIdx < 4) {
                        let k = optKeys[currentOptIdx];
                        if (!qObj.options[k]) {
                            qObj.options[k] = line;
                            currentOptIdx++;
                        }
                    }
                } else if (currentSection === 'solution') {
                    qObj.solution += (qObj.solution ? '\n' : '') + line;
                }
            }

            return (qObj.text || qObj.options.A) ? qObj : null;
        }

        function parseInputText(text) {
            // सबसे पहले प्रश्नों को ब्लॉक/पैराग्राफ में तोड़ा जाएगा
            let rawBlocks = text.split(/\n\s*\n/);
            
            // अगर खाली लाइन से अलग न हुआ हो तो 'प्रश्न' या नंबर से तोड़ेगा
            if (rawBlocks.length <= 1) {
                rawBlocks = text.split(/(?=(?:प्रश्न|Q|Question)\s*\d+[\.\:\)]|\n\d+[\.\:\)])/i);
            }

            const questions = [];
            for (let block of rawBlocks) {
                if (!block.trim()) continue;
                let parsed = parseBlock(block.trim());
                if (parsed) questions.push(parsed);
            }

            return questions;
        }

        let generatedString = "";

        function generateCustomFormat() {
            const text = document.getElementById('inputText').value;
            const status = document.getElementById('statusMessage');

            if (!text.trim()) {
                alert('कृपया पहले बॉक्स में प्रश्न पेस्ट करें!');
                return;
            }

            const questions = parseInputText(text);

            if (questions.length === 0) {
                alert('प्रश्न पहचानने में समस्या आ रही है। कृपया इनपुट चेक करें।');
                return;
            }

            let result = "";

            questions.forEach((q, index) => {
                const qNum = index + 1;
                result += `#Hindi_directions\n`;
                result += `#Question ${qNum}\n`;
                result += `${q.text}\n`;
                result += `#Options ###A\n${q.options.A || ''}\n`;
                result += `###B\n${q.options.B || ''}\n`;
                result += `###C\n${q.options.C || ''}\n`;
                result += `###D\n${q.options.D || ''}\n`;
                result += `#Correct_option\n${q.answer}\n`;
                result += `#Solution\n${q.solution}\n\n`;
            });

            generatedString = result.trim();
            document.getElementById('outputText').value = generatedString;
            status.innerText = `✅ कुल ${questions.length} प्रश्नों को आपके फॉर्मेट में सफलतापूर्वक बदल दिया गया है!`;
            setTimeout(() => status.innerText = '', 4000);
        }

        function downloadFile() {
            if (!generatedString) {
                alert('पहले फॉर्मेट जनरेट करें!');
                return;
            }

            const blob = new Blob([generatedString], { type: 'text/plain;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = downloadUrl;
            a.download = `Formatted_Test_Series_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);
        }

        function copyText() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('कॉपी करने के लिए कुछ नहीं है!');
                return;
            }
            outputText.select();
            navigator.clipboard.writeText(outputText.value).then(() => {
                const status = document.getElementById('statusMessage');
                status.innerText = '📋 फॉर्मेट क्लिपबोर्ड में कॉपी हो गया!';
                setTimeout(() => status.innerText = '', 3000);
            });
        }
    </script>
</body>
</html>
