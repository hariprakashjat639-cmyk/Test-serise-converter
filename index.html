<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test Series Bulk JSON Generator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f6f9; 
            margin: 0;
        }
        .container { 
            max-width: 900px; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8; 
            margin-top: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        textarea { 
            width: 100%; 
            height: 400px; 
            padding: 15px; 
            font-size: 14px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #1a73e8;
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button { 
            flex: 1;
            padding: 12px; 
            background-color: #1a73e8; 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background-color: #34a853;
        }
        .btn-secondary:hover {
            background-color: #2b8743;
        }
        #statusMessage {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Firebase Test Series Bulk JSON Generator</h2>
        
        <div class="grid">
            <div>
                <label for="inputText">यहाँ प्रश्न पेस्ट करें:</label>
                <textarea id="inputText" placeholder="1. प्रश्न...
A. ऑप्शन 1
B. ऑप्शन 2
C. ऑप्शन 3
D. ऑप्शन 4
सही उत्तर - A
व्याख्या - उत्तर की व्याख्या..."></textarea>
                
                <div class="btn-group">
                    <button onclick="generateJSON()">JSON बनाएँ</button>
                </div>
            </div>

            <div>
                <label for="outputText">Firebase Bulk JSON आउटपुट:</label>
                <textarea id="outputText" readonly placeholder="यहाँ जनरेट किया हुआ JSON दिखेगा..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-secondary" onclick="downloadJSON()">JSON डाउनलोड करें</button>
                    <button onclick="copyJSON()">कॉपी करें</button>
                </div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        function parseInputText(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;
            let currentState = 'none';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // प्रश्न ढूँढना (1. या 1))
                const qMatch = line.match(/^(\d+)[\.\)]\s*(.*)/);
                if (qMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { 
                        id: parseInt(qMatch[1]), 
                        question: qMatch[2], 
                        options: { A: "", B: "", C: "", D: "" }, 
                        answer: "", 
                        solution: "" 
                    };
                    currentState = 'question';
                    continue;
                }

                // ऑप्शन ढूँढना (A., B., C., D.)
                const optMatch = line.match(/^([A-D])[\.\)]\s*(.*)/);
                if (optMatch && currentQ) {
                    currentQ.options[optMatch.groups ? optMatch.groups[1] : optMatch[1]] = optMatch[2];
                    // Fallback key index check
                    const key = optMatch[1].toUpperCase();
                    if(currentQ.options.hasOwnProperty(key)) {
                        currentQ.options[key] = optMatch[2];
                    }
                    currentState = 'options';
                    continue;
                }

                // उत्तर ढूँढना
                const ansMatch = line.match(/^(?:सही उत्तर|Correct Option|Answer)\s*[:\-]\s*([A-D])/i);
                if (ansMatch && currentQ) {
                    currentQ.answer = ansMatch[1].toUpperCase();
                    currentState = 'answer';
                    continue;
                }

                // व्याख्या ढूँढना
                const solMatch = line.match(/^(?:व्याख्या|Solution)\s*[:\-]\s*(.*)/i);
                if (solMatch !== null && currentQ) {
                    currentQ.solution = solMatch[1] ? solMatch[1] : '';
                    currentState = 'solution';
                    continue;
                }

                if (currentQ) {
                    if (currentState === 'question') {
                        currentQ.question += '\n' + line;
                    } else if (currentState === 'solution') {
                        currentQ.solution += '\n' + line;
                    } else if (currentState === 'options') {
                        const lastOpt = Object.keys(currentQ.options).filter(k => currentQ.options[k] !== "").pop() || 'A';
                        if (currentQ.options[lastOpt]) {
                            currentQ.options[lastOpt] += ' ' + line;
                        }
                    }
                }
            }

            if (currentQ) questions.push(currentQ);
            return questions;
        }

        let generatedDataString = "";

        function generateJSON() {
            const text = document.getElementById('inputText').value;
            const status = document.getElementById('statusMessage');

            if (!text.trim()) {
                alert('कृपया पहले बॉक्स में प्रश्न पेस्ट करें!');
                return;
            }

            const questions = parseInputText(text);

            if (questions.length === 0) {
                alert('कोई सही प्रश्न नहीं मिला! कृपया सुनिश्चित करें कि प्रश्न "1." से शुरू हों और ऑप्शन "A." से।');
                return;
            }

            // Firebase friendly structure wrapper object or array
            generatedDataString = JSON.stringify(questions, null, 4);
            document.getElementById('outputText').value = generatedDataString;
            status.innerText = `✅ कुल ${questions.length} प्रश्नों का JSON सफलतापूर्वक तैयार हो गया है!`;
            setTimeout(() => status.innerText = '', 4000);
        }

        function downloadJSON() {
            if (!generatedDataString) {
                alert('पहले JSON जनरेट करें!');
                return;
            }

            const blob = new Blob([generatedDataString], { type: 'application/json;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = downloadUrl;
            a.download = `Test_Series_Bulk_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);
        }

        function copyJSON() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('कॉपी करने के लिए कुछ नहीं है!');
                return;
            }
            outputText.select();
            navigator.clipboard.writeText(outputText.value).then(() => {
                const status = document.getElementById('statusMessage');
                status.innerText = '📋 JSON क्लिपबोर्ड में कॉपी हो गया!';
                setTimeout(() => status.innerText = '', 3000);
            });
        }
    </script>
</body>
</html>
