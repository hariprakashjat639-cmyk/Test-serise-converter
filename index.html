<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX Bulk Test Generator</title>
    <!-- DOCX Stable JS Library -->
    <script src="https://unpkg.com/docx@8.2.3/build/index.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f6f9; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8; 
            margin-top: 0;
        }
        textarea { 
            width: 100%; 
            height: 350px; 
            padding: 15px; 
            font-size: 15px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 20px; 
            background-color: #1a73e8; 
            color: #ffffff; 
            font-size: 18px; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        button:disabled {
            background-color: #a0c3ff;
            cursor: wait;
        }
        #statusMessage {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DOCX Bulk Test Generator</h2>

        <textarea id="inputText" placeholder="यहाँ प्रश्न पेस्ट करें...

1. प्रश्न...
A. ऑप्शन 1
B. ऑप्शन 2
C. ऑप्शन 3
D. ऑप्शन 4
सही उत्तर - A
व्याख्या - उत्तर की व्याख्या..."></textarea>

        <button id="downloadBtn" onclick="generateAndDownloadDOCX()">DOCX डाउनलोड करें</button>
        <div id="statusMessage"></div>
    </div>

    <script>
        function parseInputText(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;
            let currentState = 'none';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // प्रश्न ढूँढना (1. या 1))
                const qMatch = line.match(/^(\d+)[\.\)]\s*(.*)/);
                if (qMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { id: qMatch[1], text: qMatch[2], options: {}, answer: '', solution: '' };
                    currentState = 'question';
                    continue;
                }

                // ऑप्शन ढूँढना (A., B., C., D.)
                const optMatch = line.match(/^([A-D])[\.\)]\s*(.*)/);
                if (optMatch && currentQ) {
                    currentQ.options[optMatch[1]] = optMatch[2];
                    currentState = 'options';
                    continue;
                }

                // उत्तर ढूँढना
                const ansMatch = line.match(/^(?:सही उत्तर|Correct Option|Answer)\s*[:\-]\s*([A-D])/i);
                if (ansMatch && currentQ) {
                    currentQ.answer = ansMatch[1].toUpperCase();
                    currentState = 'answer';
                    continue;
                }

                // व्याख्या ढूँढना
                const solMatch = line.match(/^(?:व्याख्या|Solution)\s*[:\-]\s*(.*)/i);
                if (solMatch !== null && currentQ) {
                    currentQ.solution = solMatch[1] ? solMatch[1] : '';
                    currentState = 'solution';
                    continue;
                }

                if (currentQ) {
                    if (currentState === 'question') {
                        currentQ.text += '\n' + line;
                    } else if (currentState === 'solution') {
                        currentQ.solution += (currentQ.solution ? '\n' : '') + line;
                    }
                }
            }

            if (currentQ) questions.push(currentQ);
            return questions;
        }

        function generateAndDownloadDOCX() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('statusMessage');
            const text = document.getElementById('inputText').value;

            if (!text.trim()) {
                alert('कृपया पहले बॉक्स में प्रश्न पेस्ट करें!');
                return;
            }

            const docxLib = window.docx;
            if (!docxLib) {
                alert('DOCX लाइब्रेरी लोड नहीं हो पाई। पेज रिफ्रेश करके दोबारा प्रयास करें!');
                return;
            }

            try {
                // UI अपडेट (यूजर को पता चले कि काम हो रहा है)
                btn.disabled = true;
                btn.innerText = 'फाइल बन रही है...';
                status.innerText = '';

                const questions = parseInputText(text);

                if (questions.length === 0) {
                    alert('कोई सही प्रश्न नहीं मिला! कृपया सुनिश्चित करें कि प्रश्न "1." से शुरू हों और ऑप्शन "A." से।');
                    btn.disabled = false;
                    btn.innerText = 'DOCX डाउनलोड करें';
                    return;
                }

                const { Document, Packer, Paragraph } = docxLib;
                const docChildren = [];

                docChildren.push(new Paragraph({ text: "#Hindi_directions" }));

                questions.forEach((q, index) => {
                    const qNum = index + 1;

                    docChildren.push(new Paragraph({ text: `#Question ${qNum}` }));
                    q.text.split('\n').forEach(l => docChildren.push(new Paragraph({ text: l })));

                    docChildren.push(new Paragraph({ text: "#Options ###A" }));
                    docChildren.push(new Paragraph({ text: q.options['A'] || '' }));

                    docChildren.push(new Paragraph({ text: "###B" }));
                    docChildren.push(new Paragraph({ text: q.options['B'] || '' }));

                    docChildren.push(new Paragraph({ text: "###C" }));
                    docChildren.push(new Paragraph({ text: q.options['C'] || '' }));

                    docChildren.push(new Paragraph({ text: "###D" }));
                    docChildren.push(new Paragraph({ text: q.options['D'] || '' }));

                    docChildren.push(new Paragraph({ text: "#Correct_option" }));
                    docChildren.push(new Paragraph({ text: q.answer || '' }));

                    docChildren.push(new Paragraph({ text: "#Solution" }));
                    q.solution.split('\n').forEach(l => {
                        if (l.trim()) docChildren.push(new Paragraph({ text: l.trim() }));
                    });
                });

                const doc = new Document({
                    sections: [{ properties: {}, children: docChildren }]
                });

                // Direct Browser Download (Promise base - मोबाइल ब्राउज़र ब्लॉकिंग से बचने के लिए)
                Packer.toBlob(doc).then(blob => {
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = downloadUrl;
                    a.download = `Bulk_Test_${Date.now()}.docx`;
                    document.body.appendChild(a);
                    a.click();

                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(downloadUrl);
                    }, 100);

                    btn.disabled = false;
                    btn.innerText = 'DOCX डाउनलोड करें';
                    status.innerText = '✅ फाइल सफलतापूर्वक डाउनलोड हो गई!';
                    setTimeout(() => status.innerText = '', 4000);
                }).catch(err => {
                    console.error(err);
                    alert('फाइल सेव करने में समस्या: ' + err.message);
                    btn.disabled = false;
                    btn.innerText = 'DOCX डाउनलोड करें';
                });

            } catch (error) {
                console.error(error);
                alert("प्रोसेस एरर: " + error.message);
                btn.disabled = false;
                btn.innerText = 'DOCX डाउनलोड करें';
            }
        }
    </script>
</body>
</html>
