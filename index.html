<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX Bulk Test Converter</title>
    <!-- DOCX Library Link -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f6f9; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8; 
            margin-top: 0;
        }
        .info-box {
            background: #e8f0fe;
            border-left: 5px solid #1a73e8;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }
        textarea { 
            width: 100%; 
            height: 350px; 
            padding: 15px; 
            font-size: 15px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 20px; 
            background-color: #1a73e8; 
            color: #ffffff; 
            font-size: 18px; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        button:hover { 
            background-color: #1557b0; 
        }
        button:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DOCX Bulk Test Generator</h2>
        
        <div class="info-box">
            <strong>फॉर्मेट का तरीका:</strong> अपने सभी प्रश्नों को यहाँ पेस्ट करें। ऐप अपने आप <code>#Hindi_directions</code>, <code>#Question 1</code>, <code>#Options ###A</code>, <code>#Correct_option</code> और <code>#Solution</code> के सांचे में बदल कर DOCX डाउनलोड कर देगा।
        </div>

        <textarea id="inputText" placeholder="यहाँ प्रश्न पेस्ट करें...

उदाहरण:
1. श्वसन तंत्र को प्रभावित करने वाले 'काली खांसी' नामक अत्यंत संक्रामक रोग का मुख्य कारक कौन सा सूक्ष्मजीव है?

A. जीवाणु
B. विषाणु
C. कवक
D. प्रोटोजोआ

सही उत्तर - A

व्याख्या - 
काली खांसी एक जीवाणु जनित रोग है..."></textarea>

        <button id="downloadBtn" onclick="generateAndDownloadDOCX()">DOCX डाउनलोड करें</button>
    </div>

    <script>
        // पाठ (Text) को समझकर अलग करने का फंक्शन
        function parseInputText(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;
            let currentState = 'none';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // प्रश्न नंबर पहचानना (जैसे 1. या 1) )
                const qMatch = line.match(/^(\d+)[\.\)]\s*(.*)/);
                if (qMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { id: qMatch[1], text: qMatch[2], options: {}, answer: '', solution: '' };
                    currentState = 'question';
                    continue;
                }

                // ऑप्शन पहचानना (A., B., C., D.)
                const optMatch = line.match(/^([A-D])[\.\)]\s*(.*)/);
                if (optMatch && currentQ) {
                    currentQ.options[optMatch[1]] = optMatch[2];
                    currentState = 'options';
                    continue;
                }

                // सही उत्तर पहचानना (सही उत्तर - A या Correct Option - A)
                const ansMatch = line.match(/^(?:सही उत्तर|Correct Option|Answer)\s*[:\-]\s*([A-D])/i);
                if (ansMatch && currentQ) {
                    currentQ.answer = ansMatch[1].toUpperCase();
                    currentState = 'answer';
                    continue;
                }

                // व्याख्या पहचानना (व्याख्या - ... या Solution - ...)
                const solMatch = line.match(/^(?:व्याख्या|Solution)\s*[:\-]\s*(.*)/i);
                if (solMatch !== null && currentQ) {
                    currentQ.solution = solMatch[1] ? solMatch[1] : '';
                    currentState = 'solution';
                    continue;
                }

                // मल्टी-लाइन सपोर्ट (अगर प्रश्न या व्याख्या कई लाइनों में हो)
                if (currentQ) {
                    if (currentState === 'question') {
                        currentQ.text += '\n' + line;
                    } else if (currentState === 'solution') {
                        currentQ.solution += (currentQ.solution ? '\n' : '') + line;
                    }
                }
            }

            if (currentQ) questions.push(currentQ);
            return questions;
        }

        // 100% Direct Download Function
        async function generateAndDownloadDOCX() {
            const text = document.getElementById('inputText').value;

            if (!text.trim()) {
                alert('कृपया बॉक्स में टेक्स्ट पेस्ट करें!');
                return;
            }

            if (typeof docx === 'undefined') {
                alert('DOCX लाइब्रेरी लोड नहीं हो पाई। कृपया इंटरनेट कनेक्शन चेक करें या पेज रिफ्रेश करें।');
                return;
            }

            try {
                const questions = parseInputText(text);

                if (questions.length === 0) {
                    alert('कोई सही प्रश्न नहीं मिला! कृपया सुनिश्चित करें कि प्रश्न "1." से शुरू हो और विकल्प "A." से।');
                    return;
                }

                const { Document, Packer, Paragraph } = window.docx;
                const docChildren = [];

                // 1. शीर्ष टैग
                docChildren.push(new Paragraph({ text: "#Hindi_directions" }));

                // 2. सभी प्रश्नों का लूप
                questions.forEach((q, index) => {
                    const qNum = index + 1;

                    // प्रश्न टैग और टेक्स्ट
                    docChildren.push(new Paragraph({ text: `#Question ${qNum}` }));
                    q.text.split('\n').forEach(l => docChildren.push(new Paragraph({ text: l })));

                    // विकल्प (Options)
                    docChildren.push(new Paragraph({ text: "#Options ###A" }));
                    docChildren.push(new Paragraph({ text: q.options['A'] || '' }));

                    docChildren.push(new Paragraph({ text: "###B" }));
                    docChildren.push(new Paragraph({ text: q.options['B'] || '' }));

                    docChildren.push(new Paragraph({ text: "###C" }));
                    docChildren.push(new Paragraph({ text: q.options['C'] || '' }));

                    docChildren.push(new Paragraph({ text: "###D" }));
                    docChildren.push(new Paragraph({ text: q.options['D'] || '' }));

                    // सही उत्तर टैग
                    docChildren.push(new Paragraph({ text: "#Correct_option" }));
                    docChildren.push(new Paragraph({ text: q.answer }));

                    // व्याख्या (Solution) टैग
                    docChildren.push(new Paragraph({ text: "#Solution" }));
                    q.solution.split('\n').forEach(l => {
                        if (l.trim()) docChildren.push(new Paragraph({ text: l.trim() }));
                    });
                });

                // DOCX निर्माण
                const doc = new Document({
                    sections: [{ properties: {}, children: docChildren }]
                });

                // सीधे ब्राउज़र में डाउनलोड जनरेट करना (No FileSaver library required)
                const blob = await Packer.toBlob(doc);
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `Test_Series_Bulk_${Date.now()}.docx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

            } catch (error) {
                console.error(error);
                alert("फाइल बनाने में समस्या आई: " + error.message);
            }
        }
    </script>
</body>
</html>
