<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Test Series Custom Format Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .container { 
            max-width: 1050px; 
            margin: 20px auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin-top: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .pane {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        textarea { 
            width: 100%; 
            height: 420px; 
            padding: 15px; 
            font-size: 14px; 
            border: 2px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            resize: vertical;
            font-family: inherit;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        button { 
            flex: 1;
            padding: 14px; 
            background-color: var(--primary); 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 600;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--success);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .btn-secondary:hover {
            background-color: var(--success-hover);
        }

        #statusMessage {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            color: var(--success);
            font-size: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Custom Test Series Format Generator</h2>
        
        <div class="grid">
            <!-- Input Pane -->
            <div class="pane">
                <label for="inputText">यहाँ रॉ (Raw) प्रश्न पेस्ट करें:</label>
                <textarea id="inputText" placeholder="प्रश्न 1: प्रश्न का नाम...
(अ) ऑप्शन 1
(ब) ऑप्शन 2
(स) ऑप्शन 3
(द) ऑप्शन 4
सही उत्तर: (स) सही उत्तर का विवरण...
व्याख्या: व्याख्या की जानकारी..."></textarea>
                
                <div class="btn-group">
                    <button onclick="generateCustomFormat()">फॉर्मेट में बदलें</button>
                </div>
            </div>

            <!-- Output Pane -->
            <div class="pane">
                <label for="outputText">आउटपुट फॉर्मेट:</label>
                <textarea id="outputText" readonly placeholder="यहाँ आपका कन्वर्ट किया हुआ फॉर्मेट दिखेगा..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-secondary" onclick="downloadFile()">फाइल डाउनलोड करें</button>
                    <button onclick="copyText()">कॉपी करें</button>
                </div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        // हिंदी वर्णमाला के विकल्पों को A, B, C, D में बदलने का फ़ंक्शन
        function normalizeOptionKey(symbol) {
            if (!symbol) return null;
            symbol = symbol.trim().toLowerCase();
            
            // अंग्रेजी विकल्प
            if (symbol === 'a') return 'A';
            if (symbol === 'b') return 'B';
            if (symbol === 'c') return 'C';
            if (symbol === 'd') return 'D';

            // हिंदी विकल्प (अ/ब/स/द या क/ख/ग/घ)
            if (symbol === 'अ' || symbol === 'क') return 'A';
            if (symbol === 'ब' || symbol === 'ख') return 'B';
            if (symbol === 'स' || symbol === 'ग') return 'C';
            if (symbol === 'द' || symbol === 'घ') return 'D';

            return null;
        }

        function parseInputText(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;
            let currentState = 'none';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // 1. प्रश्न पहचान (जैसे: "प्रश्न 1:", "Q1.", "1.")
                const qMatch = line.match(/^(?:प्रश्न|Q|Question)?\s*[\(\[]?\s*(\d+)[\.\:\)]\s*(.*)/i);
                if (qMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { 
                        id: qMatch[1], 
                        text: qMatch[2], 
                        options: { A: "", B: "", C: "", D: "" }, 
                        answer: "", 
                        solution: "" 
                    };
                    currentState = 'question';
                    continue;
                }

                // 2. विकल्प पहचान (जैसे: (a), (अ), (1), A., a), अ.)
                const optMatch = line.match(/^[\(\[]?\s*([A-Da-d|अ|ब|स|द|क|ख|ग|घ])\s*[\)\]\.\:]\s*(.*)/);
                if (optMatch && currentQ) {
                    const mappedKey = normalizeOptionKey(optMatch[1]);
                    if (mappedKey && currentQ.options.hasOwnProperty(mappedKey)) {
                        currentQ.options[mappedKey] = optMatch[2];
                        currentState = 'options';
                        continue;
                    }
                }

                // 3. उत्तर पहचान (जैसे: सही उत्तर: (स), Ans: A, उत्तर - B)
                const ansMatch = line.match(/^(?:सही\s*उत्तर|उत्तर|Correct\s*Option|Answer|Ans)\s*[:\-]?\s*(?:[\(\[]?\s*([A-Da-d|अ|ब|स|द|क|ख|ग|घ])\s*[\)\]]?)?(.*)/i);
                if (ansMatch && currentQ) {
                    let key = null;
                    if (ansMatch[1]) {
                        key = normalizeOptionKey(ansMatch[1]);
                    } else {
                        const directMatch = line.match(/([A-Da-d|अ|ब|स|द|क|ख|ग|घ])/);
                        if (directMatch) key = normalizeOptionKey(directMatch[1]);
                    }
                    if (key) currentQ.answer = key;
                    currentState = 'answer';
                    continue;
                }

                // 4. व्याख्या/सॉल्यूशन पहचान
                const solMatch = line.match(/^(?:व्याख्या|स्पष्टीकरण|Solution|Exp)\s*[:\-]?\s*(.*)/i);
                if (solMatch !== null && currentQ) {
                    currentQ.solution = solMatch[1] ? solMatch[1] : '';
                    currentState = 'solution';
                    continue;
                }

                // 5. यदि कोई पंक्ति कई लाइनों में बंटी हो
                if (currentQ) {
                    if (currentState === 'question') {
                        currentQ.text += '\n' + line;
                    } else if (currentState === 'solution') {
                        currentQ.solution += '\n' + line;
                    } else if (currentState === 'options') {
                        const lastOpt = Object.keys(currentQ.options).filter(k => currentQ.options[k] !== "").pop() || 'A';
                        if (currentQ.options[lastOpt]) {
                            currentQ.options[lastOpt] += ' ' + line;
                        }
                    }
                }
            }

            if (currentQ) questions.push(currentQ);
            return questions;
        }

        let generatedString = "";

        function generateCustomFormat() {
            const text = document.getElementById('inputText').value;
            const status = document.getElementById('statusMessage');

            if (!text.trim()) {
                alert('कृपया पहले बॉक्स में प्रश्न पेस्ट करें!');
                return;
            }

            const questions = parseInputText(text);

            if (questions.length === 0) {
                alert('प्रश्न पहचानने में समस्या आ रही है। कृपया इनपुट को सही से चेक करें।');
                return;
            }

            let result = "";

            questions.forEach((q, index) => {
                const qNum = index + 1;
                result += `#Hindi_directions\n`;
                result += `#Question ${qNum}\n`;
                result += `${q.text}\n`;
                result += `#Options ###A\n${q.options.A || ''}\n`;
                result += `###B\n${q.options.B || ''}\n`;
                result += `###C\n${q.options.C || ''}\n`;
                result += `###D\n${q.options.D || ''}\n`;
                result += `#Correct_option\n${q.answer}\n`;
                result += `#Solution\n${q.solution}\n\n`;
            });

            generatedString = result.trim();
            document.getElementById('outputText').value = generatedString;
            status.innerText = `✅ कुल ${questions.length} प्रश्नों को आपके फॉर्मेट में सफलतापूर्वक बदल दिया गया है!`;
            setTimeout(() => status.innerText = '', 4000);
        }

        function downloadFile() {
            if (!generatedString) {
                alert('पहले फॉर्मेट जनरेट करें!');
                return;
            }

            const blob = new Blob([generatedString], { type: 'text/plain;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = downloadUrl;
            a.download = `Formatted_Test_Series_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);
        }

        function copyText() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('कॉपी करने के लिए कुछ नहीं है!');
                return;
            }
            outputText.select();
            navigator.clipboard.writeText(outputText.value).then(() => {
                const status = document.getElementById('statusMessage');
                status.innerText = '📋 फॉर्मेट क्लिपबोर्ड में कॉपी हो गया!';
                setTimeout(() => status.innerText = '', 3000);
            });
        }
    </script>
</body>
</html>
